<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投訴系統</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    /* ===== 基本樣式 ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #f4f7fc;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
      padding: 2rem 2rem 2.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b1e33;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.3rem;
    }
    h1 i {
      color: #d93c3c;
      font-size: 2rem;
    }
    .subhead {
      color: #5b6f82;
      margin-bottom: 2rem;
      border-left: 4px solid #d93c3c;
      padding-left: 1rem;
      font-weight: 400;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-count {
      background: #eef3f9;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #1f3a57;
    }
    .badge-count i {
      margin-right: 6px;
      color: #c22d2d;
    }

    /* 頂部導航 */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1rem 0;
      border-bottom: 1px solid #eef3f9;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #c52a2a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }
    .user-name {
      font-weight: 500;
      color: #1a2c44;
    }
    .user-role {
      font-size: 0.75rem;
      color: #7e93ab;
      background: #eef3f9;
      padding: 0.15rem 0.8rem;
      border-radius: 40px;
    }
    .user-role.admin {
      background: #c52a2a;
      color: white;
    }
    .btn-google {
      background: white;
      border: 1px solid #d7dfe9;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #2a405b;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .btn-google:hover {
      background: #f4f8ff;
      border-color: #b0c0d0;
    }
    .btn-google svg {
      width: 18px;
      height: 18px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid #f5d8d8;
      color: #b43b3b;
      border-radius: 40px;
      padding: 0.3rem 1rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    .btn-logout:hover {
      background: #fff3f3;
    }
    .btn-admin-login {
      background: #2a405b;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 0.3rem 1.2rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    .btn-admin-login:hover {
      background: #1a2c44;
    }
    .btn-admin-login.active {
      background: #c52a2a;
    }

    /* 主內容雙欄 */
    .row {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 2rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 820px) {
      .row {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }
      .container {
        padding: 1.5rem;
      }
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.6rem 1.8rem 2rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
      border: 1px solid #e9edf4;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a2c44;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .card-title i {
      color: #c52a2a;
      width: 28px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #2a405b;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }
    label i {
      margin-right: 6px;
      color: #6c7e94;
      width: 18px;
    }
    label .required {
      color: #c52a2a;
      margin-left: 2px;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #d7dfe9;
      border-radius: 16px;
      font-size: 0.95rem;
      background: #fafcff;
      transition: 0.15s;
      outline: none;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b32b2b;
      box-shadow: 0 0 0 3px rgba(179, 43, 43, 0.08);
      background: white;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }
    .file-upload-wrapper {
      position: relative;
      border: 2px dashed #d7dfe9;
      border-radius: 16px;
      padding: 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: 0.15s;
      background: #fafcff;
    }
    .file-upload-wrapper:hover {
      border-color: #b32b2b;
      background: #f8f4f4;
    }
    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-upload-wrapper .upload-icon {
      font-size: 2rem;
      color: #8a9db0;
    }
    .file-upload-wrapper .upload-text {
      color: #6b8097;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .file-upload-wrapper .file-name {
      color: #1a2c44;
      font-weight: 500;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .file-preview {
      margin-top: 10px;
      max-width: 200px;
      max-height: 150px;
      border-radius: 12px;
      border: 1px solid #e6ecf5;
      display: none;
    }
    .file-preview.show {
      display: inline-block;
    }
    .btn-primary {
      background: #c52a2a;
      border: none;
      color: white;
      padding: 0.85rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 0.5rem;
      border: 1px solid #b12222;
    }
    .btn-primary:hover {
      background: #a81f1f;
      transform: scale(0.99);
      box-shadow: 0 6px 16px rgba(197, 42, 42, 0.2);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary i {
      font-size: 1rem;
    }

    /* 列表 */
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-bar select {
      width: auto;
      padding: 0.4rem 1.8rem 0.4rem 1rem;
      border-radius: 40px;
      background: #f4f8ff;
      border: 1px solid #d7dfe9;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-bar .clear-btn {
      background: transparent;
      border: 1px solid #d7dfe9;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: #4f657c;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-bar .clear-btn:hover {
      background: #f0f4fa;
      border-color: #b0c0d0;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 0.5rem;
      color: #7c8ea3;
    }
    .empty-state i {
      font-size: 3rem;
      opacity: 0.4;
      margin-bottom: 1rem;
    }
    .complaint-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .complaint-item {
      background: #fafcff;
      border: 1px solid #e6ecf5;
      border-radius: 20px;
      padding: 1rem 1.2rem;
      transition: 0.1s;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.6rem 1rem;
    }
    .complaint-item:hover {
      background: #f6f9ff;
      border-color: #cbd8e9;
    }
    .complaint-content {
      flex: 2 1 200px;
    }
    .complaint-title {
      font-weight: 600;
      color: #10273e;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .complaint-title .status-badge {
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      background: #e2e9f2;
      color: #2b4a6a;
      letter-spacing: 0.3px;
    }
    .status-badge.new {
      background: #ffe2e2;
      color: #a52323;
    }
    .status-badge.progress {
      background: #fff1d6;
      color: #a8681c;
    }
    .status-badge.resolved {
      background: #ddf0e0;
      color: #1d7540;
    }
    .complaint-meta {
      font-size: 0.8rem;
      color: #61768b;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      margin-top: 4px;
    }
    .complaint-meta i {
      width: 16px;
      color: #7d93ab;
    }
    .complaint-image {
      max-width: 120px;
      max-height: 100px;
      border-radius: 12px;
      border: 1px solid #e6ecf5;
      margin-top: 6px;
      cursor: pointer;
      object-fit: cover;
    }
    .complaint-image:hover {
      opacity: 0.8;
    }
    .complaint-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      align-items: center;
    }
    .complaint-actions button {
      background: transparent;
      border: 1px solid #d0dbe9;
      border-radius: 40px;
      padding: 0.25rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2a405b;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .complaint-actions .btn-resolve {
      background: #e8f3eb;
      border-color: #b2cfbb;
      color: #1d6e3c;
    }
    .complaint-actions .btn-resolve:hover {
      background: #d0e8d7;
    }
    .complaint-actions .btn-delete {
      border-color: #f5d8d8;
      color: #b43b3b;
      background: #fff3f3;
    }
    .complaint-actions .btn-delete:hover {
      background: #fde2e2;
    }
    .complaint-actions .btn-status {
      background: #edf3fa;
      border-color: #c8d6e8;
    }
    .complaint-actions .btn-status:hover {
      background: #dfe9f5;
    }

    /* Toast */
    .toast-message {
      background: #1f3a57;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      transition: 0.25s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toast-message.show {
      opacity: 1;
      pointer-events: auto;
    }
    .toast-message i {
      margin-right: 10px;
      color: #ffbaba;
    }
    .text-muted {
      color: #6b8097;
      font-size: 0.85rem;
    }
    hr {
      border: none;
      border-top: 1px solid #e6ecf5;
      margin: 0.5rem 0 1.2rem;
    }
    ::-webkit-scrollbar {
      width: 5px;
      background: #eef3f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd6e4;
      border-radius: 10px;
    }

    .admin-badge {
      background: #2a405b;
      color: white;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      margin-left: 8px;
    }

    /* 登入彈窗 */
    .login-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .login-overlay.active {
      display: flex;
    }
    .login-box {
      background: white;
      padding: 2.5rem;
      border-radius: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .login-box h3 {
      margin-bottom: 1.5rem;
      color: #0b1e33;
    }
    .login-box input {
      margin-bottom: 1rem;
    }
    .login-box .btn-primary {
      width: 100%;
      margin-top: 0;
    }
    .login-box .hint {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #8a9db0;
    }
    .login-box .hint strong {
      color: #c52a2a;
    }
    .login-box .error-msg {
      color: #c52a2a;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      display: none;
    }
    .login-box .error-msg.show {
      display: block;
    }

    /* 圖片預覽燈箱 */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-megaphone"></i> 投訴系統</h1>
      <div class="subhead">
        <span><i class="fas fa-flag" style="color:#c52a2a; margin-right: 6px;"></i> 訪客可直接投訴，管理員將即時處理</span>
        <span class="badge-count"><i class="fas fa-list-ul"></i> 總投訴 <span id="totalCount">0</span></span>
      </div>
    </header>

    <!-- ===== 頂部導航 ===== -->
    <div class="top-nav">
      <div class="user-info" id="userInfo">
        <div class="user-avatar" id="userAvatar">👤</div>
        <span class="user-name" id="userNameDisplay">訪客</span>
        <span class="user-role" id="userRoleDisplay">一般</span>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button class="btn-google" id="googleLoginBtn" style="display:none;">
          <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg>
          Google 登入
        </button>
        <button class="btn-logout" id="logoutBtn" style="display:none;">登出</button>
        <button class="btn-admin-login" id="adminLoginBtn"><i class="fas fa-user-shield"></i> 管理</button>
      </div>
    </div>

    <div class="row">
      <!-- ===== 左欄：投訴表單（訪客可直接填寫） ===== -->
      <div class="card">
        <div class="card-title"><i class="fas fa-pen"></i> 新增投訴</div>
        <form id="complaintForm">
          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-user"></i> 姓名 <span class="required">*</span></label>
              <input type="text" id="userName" placeholder="請輸入您的姓名" required />
            </div>
            <div class="form-group">
              <label><i class="fab fa-instagram"></i> IG 名稱</label>
              <input type="text" id="igName" placeholder="@ 或 暱稱" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label><i class="fas fa-tag"></i> 類別 <span class="required">*</span></label>
              <select id="category" required>
                <option value="">請選擇</option>
                <option value="服務品質">服務品質</option>
                <option value="商品問題">商品問題</option>
                <option value="環境衛生">環境衛生</option>
                <option value="人員態度">人員態度</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-group">
              <label><i class="fas fa-flag"></i> 嚴重程度 <span class="required">*</span></label>
              <select id="priority" required>
                <option value="輕微">輕微</option>
                <option value="中等" selected>中等</option>
                <option value="嚴重">嚴重</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label><i class="fas fa-heading"></i> 標題 <span class="required">*</span></label>
            <input type="text" id="title" placeholder="簡述投訴重點" required />
          </div>
          <div class="form-group">
            <label><i class="fas fa-comment"></i> 投訴內容 <span class="required">*</span></label>
            <textarea id="description" placeholder="請描述具體情況..." required></textarea>
          </div>
          <div class="form-group">
            <label><i class="fas fa-image"></i> 圖片（選擇性）</label>
            <div class="file-upload-wrapper" id="fileUploadWrapper">
              <input type="file" id="imageFile" accept="image/*" />
              <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
              <div class="upload-text">點擊或拖曳上傳圖片</div>
              <div class="file-name" id="fileName">尚未選擇檔案</div>
              <img id="filePreview" class="file-preview" />
            </div>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn">
            <i class="fas fa-paper-plane"></i> 送出投訴
          </button>
        </form>
        <div style="margin-top:1rem;font-size:0.75rem;color:#8a9db0;text-align:center;">
          <i class="fas fa-shield-alt"></i> 您的投訴將儲存於雲端，管理員會收到 Email 通知
        </div>
      </div>

      <!-- ===== 右欄：投訴列表 ===== -->
      <div class="card">
        <div class="list-header">
          <div class="card-title" style="margin-bottom:0;">
            <i class="fas fa-inbox"></i> 投訴紀錄
          </div>
          <div class="filter-bar">
            <select id="filterStatus">
              <option value="all">全部狀態</option>
              <option value="新案件">新案件</option>
              <option value="處理中">處理中</option>
              <option value="已結案">已結案</option>
            </select>
            <button class="clear-btn" id="clearAllBtn"><i class="fas fa-trash-alt"></i> 清空</button>
          </div>
        </div>
        <hr />
        <div id="complaintListContainer">
          <div class="complaint-list" id="complaintList"></div>
        </div>
        <div style="margin-top: 1rem; font-size:0.8rem; color:#7e93ab; display: flex; gap: 1rem; flex-wrap: wrap; border-top: 1px solid #eef3f9; padding-top: 1rem;">
          <span><i class="fas fa-circle" style="color:#d93c3c; font-size:0.5rem;"></i> 新案件</span>
          <span><i class="fas fa-circle" style="color:#e68a2e; font-size:0.5rem;"></i> 處理中</span>
          <span><i class="fas fa-circle" style="color:#2b8c4a; font-size:0.5rem;"></i> 已結案</span>
          <span style="margin-left:auto;"><i class="fas fa-chevron-circle-down"></i> 管理員可變更狀態</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 管理員登入彈窗 ===== -->
  <div class="login-overlay" id="adminLoginOverlay">
    <div class="login-box">
      <h3><i class="fas fa-user-shield" style="color:#c52a2a;"></i> 管理員登入</h3>
      <p style="color:#6b8097;font-size:0.9rem;margin-bottom:1.2rem;">請輸入管理員帳號與密碼</p>
      <div class="error-msg" id="adminErrorMsg">❌ 帳號或密碼錯誤</div>
      <input type="text" id="adminUsername" placeholder="管理員帳號" />
      <input type="password" id="adminPassword" placeholder="管理員密碼" />
      <button class="btn-primary" id="adminLoginConfirmBtn"><i class="fas fa-sign-in-alt"></i> 登入</button>
      <div class="hint">
        預設帳號：<strong>admin</strong> ｜ 密碼：<strong>admin123</strong>
      </div>
    </div>
  </div>

  <!-- ===== 圖片燈箱 ===== -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="投訴圖片" />
  </div>

  <!-- Toast -->
  <div id="toast" class="toast-message"><i class="fas fa-check-circle"></i> <span id="toastText">操作成功</span></div>

  <script>
    // ============================================================
    // 1. ⚙️ 設定區（請填入您的金鑰）
    // ============================================================

    const firebaseConfig = {
      apiKey: "請填入您的 apiKey",
      authDomain: "請填入您的 authDomain",
      projectId: "請填入您的 projectId",
      storageBucket: "請填入您的 storageBucket",
      messagingSenderId: "請填入您的 messagingSenderId",
      appId: "請填入您的 appId"
    };

    const emailjsConfig = {
      serviceID: "請填入您的 Service ID",
      templateID: "請填入您的 Template ID",
      publicKey: "請填入您的 Public Key"
    };

    // 管理員帳號
    const ADMIN_ACCOUNTS = [
      { username: "admin", password: "admin123" }
    ];

    // ============================================================
    // 2. 初始化 Firebase
    // ============================================================

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();
    const auth = firebase.auth();

    db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn(err));
    emailjs.init(emailjsConfig.publicKey);

    // ============================================================
    // 3. 全域變數
    // ============================================================

    let currentUser = null;
    let isAdmin = false;
    let complaints = [];
    let unsubscribeSnapshot = null;
    let selectedFile = null;

    // ============================================================
    // 4. 工具函數
    // ============================================================

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getToday() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function getNowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }

    function getInitials(name) {
      if (!name) return '👤';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return parts[0][0] + parts[1][0];
      return name.substring(0, 2).toUpperCase();
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const textSpan = document.getElementById('toastText');
      textSpan.textContent = msg;
      toast.style.opacity = '1';
      toast.style.background = isError ? '#a52a2a' : '#1f3a57';
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        toast.style.opacity = '0';
      }, 3000);
    }

    // ============================================================
    // 5. 發送 Email 通知
    // ============================================================

    async function sendEmail(complaint) {
      const subject = `【新投訴 #${complaint.id}】${complaint.title}`;
      const body = `
        姓名：${complaint.userName}
        IG 名稱：${complaint.igName || '未提供'}
        類別：${complaint.category}
        嚴重程度：${complaint.priority}
        標題：${complaint.title}
        內容：${complaint.description}
        提交時間：${complaint.date} ${complaint.time || ''}
        狀態：${complaint.status}
        圖片：${complaint.imageUrl || '無'}
      `;

      try {
        await emailjs.send(
          emailjsConfig.serviceID,
          emailjsConfig.templateID,
          { subject: subject, message: body }
        );
        console.log('✅ Email 通知發送成功');
      } catch (error) {
        console.error('❌ Email 發送失敗:', error);
      }
    }

    // ============================================================
    // 6. 圖片上傳
    // ============================================================

    async function uploadImage(file, complaintId) {
      if (!file) return null;

      const storageRef = storage.ref();
      const imageRef = storageRef.child(`complaints/${complaintId}_${Date.now()}_${file.name}`);

      try {
        const snapshot = await imageRef.put(file);
        const downloadUrl = await snapshot.ref.getDownloadURL();
        return downloadUrl;
      } catch (error) {
        console.error('圖片上傳失敗:', error);
        showToast('圖片上傳失敗，但投訴已送出', true);
        return null;
      }
    }

    // ============================================================
    // 7. Firestore 操作
    // ============================================================

    function listenComplaints() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      unsubscribeSnapshot = db.collection('complaints')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          complaints = [];
          snapshot.forEach((doc) => {
            const data = doc.data();
            complaints.push({
              id: data.id,
              docId: doc.id,
              userName: data.userName || '',
              igName: data.igName || '',
              category: data.category || '',
              priority: data.priority || '',
              title: data.title || '',
              description: data.description || '',
              status: data.status || '新案件',
              date: data.date || '',
              time: data.time || '',
              imageUrl: data.imageUrl || '',
              createdAt: data.createdAt || 0
            });
          });
          render();
        }, (error) => {
          console.error('Firestore 監聽錯誤:', error);
          showToast('連線資料庫失敗，請檢查網路', true);
        });
    }

    async function addComplaint(complaint) {
      try {
        await db.collection('complaints').add({
          id: complaint.id,
          userName: complaint.userName,
          igName: complaint.igName || '',
          category: complaint.category,
          priority: complaint.priority,
          title: complaint.title,
          description: complaint.description,
          status: complaint.status,
          date: complaint.date,
          time: complaint.time,
          imageUrl: complaint.imageUrl || '',
          createdAt: Date.now()
        });
        return true;
      } catch (error) {
        console.error('儲存失敗:', error);
        showToast('儲存失敗，請稍後再試', true);
        return false;
      }
    }

    async function updateStatus(docId, newStatus) {
      try {
        await db.collection('complaints').doc(docId).update({ status: newStatus });
        return true;
      } catch (error) {
        console.error('更新失敗:', error);
        showToast('更新失敗', true);
        return false;
      }
    }

    async function deleteComplaint(docId) {
      try {
        await db.collection('complaints').doc(docId).delete();
        return true;
      } catch (error) {
        console.error('刪除失敗:', error);
        showToast('刪除失敗', true);
        return false;
      }
    }

    async function clearAllComplaints() {
      try {
        const snapshot = await db.collection('complaints').get();
        const batch = db.batch();
        snapshot.forEach((doc) => batch.delete(doc.ref));
        await batch.commit();
        showToast('已清空所有投訴');
        return true;
      } catch (error) {
        console.error('清空失敗:', error);
        showToast('清空失敗', true);
        return false;
      }
    }

    // ============================================================
    // 8. 渲染
    // ============================================================

    function render() {
      const listEl = document.getElementById('complaintList');
      const filterStatus = document.getElementById('filterStatus').value;
      const totalSpan = document.getElementById('totalCount');

      let filtered = complaints;
      if (filterStatus !== 'all') {
        filtered = complaints.filter(c => c.status === filterStatus);
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p style="margin-top: 6px;">目前沒有投訴紀錄</p>
            <span class="text-muted">新增一筆投訴吧</span>
          </div>
        `;
      } else {
        let html = '';
        filtered.forEach(item => {
          const statusClass =
            item.status === '新案件' ? 'new' :
            item.status === '處理中' ? 'progress' : 'resolved';

          const adminButtons = isAdmin ? `
            <button class="btn-status" data-action="status" data-docid="${item.docId}" data-id="${item.id}"><i class="fas fa-sync-alt"></i> 狀態</button>
            <button class="btn-resolve" data-action="resolve" data-docid="${item.docId}" data-id="${item.id}"><i class="fas fa-check"></i> 結案</button>
            <button class="btn-delete" data-action="delete" data-docid="${item.docId}" data-id="${item.id}"><i class="fas fa-times"></i></button>
          ` : '';

          const imageHtml = item.imageUrl ? `
            <img class="complaint-image" src="${item.imageUrl}" alt="投訴圖片" onclick="openLightbox('${item.imageUrl}')" />
          ` : '';

          const igHtml = item.igName ? `<span><i class="fab fa-instagram"></i> ${escapeHtml(item.igName)}</span>` : '';

          html += `
            <div class="complaint-item" data-id="${item.id}" data-docid="${item.docId}">
              <div class="complaint-content">
                <div class="complaint-title">
                  <span>${escapeHtml(item.title)}</span>
                  <span class="status-badge ${statusClass}">${item.status}</span>
                  ${isAdmin ? '<span class="admin-badge">管理</span>' : ''}
                </div>
                <div class="complaint-meta">
                  <span><i class="fas fa-user"></i> ${escapeHtml(item.userName)}</span>
                  ${igHtml}
                  <span><i class="fas fa-tag"></i> ${escapeHtml(item.category)}</span>
                  <span><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(item.priority)}</span>
                  <span><i class="far fa-calendar-alt"></i> ${item.date || '未知'} ${item.time || ''}</span>
                </div>
                <div style="margin-top: 6px; font-size:0.9rem; color:#2b405b;">${escapeHtml(item.description)}</div>
                ${imageHtml}
              </div>
              <div class="complaint-actions">
                ${adminButtons}
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      }

      totalSpan.textContent = complaints.length;
    }

    // ============================================================
    // 9. UI 更新
    // ============================================================

    function updateUI(user) {
      const avatar = document.getElementById('userAvatar');
      const nameDisplay = document.getElementById('userNameDisplay');
      const roleDisplay = document.getElementById('userRoleDisplay');
      const googleBtn = document.getElementById('googleLoginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const adminLoginBtn = document.getElementById('adminLoginBtn');

      if (user) {
        const displayName = user.displayName || user.email || '使用者';
        avatar.textContent = getInitials(displayName);
        nameDisplay.textContent = displayName;

        if (isAdmin) {
          roleDisplay.textContent = '管理員';
          roleDisplay.className = 'user-role admin';
        } else {
          roleDisplay.textContent = '一般使用者';
          roleDisplay.className = 'user-role';
        }

        googleBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';

        // 自動填入姓名
        const nameInput = document.getElementById('userName');
        if (displayName && !nameInput.value) {
          nameInput.value = displayName;
        }
      } else {
        avatar.textContent = '👤';
        nameDisplay.textContent = '訪客';
        roleDisplay.textContent = '一般';
        roleDisplay.className = 'user-role';
        googleBtn.style.display = 'inline-flex';
        logoutBtn.style.display = 'none';

        if (isAdmin) {
          isAdmin = false;
          adminLoginBtn.textContent = '管理';
          adminLoginBtn.className = 'btn-admin-login';
        }
      }
    }

    // ============================================================
    // 10. 事件處理
    // ============================================================

    // ----- 10a. Google 登入 -----
    async function googleLogin() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;
        updateUI(currentUser);
        showToast(`歡迎 ${currentUser.displayName || currentUser.email}`);
      } catch (error) {
        console.error('Google 登入失敗:', error);
        showToast('登入失敗，請稍後再試', true);
      }
    }

    document.getElementById('googleLoginBtn').addEventListener('click', googleLogin);

    // ----- 10b. 登出 -----
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      try {
        await auth.signOut();
        currentUser = null;
        isAdmin = false;
        updateUI(null);
        showToast('已登出');
      } catch (error) {
        console.error('登出失敗:', error);
      }
    });

    // ----- 10c. 管理員登入 -----
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const adminOverlay = document.getElementById('adminLoginOverlay');
    const adminConfirmBtn = document.getElementById('adminLoginConfirmBtn');
    const adminUsername = document.getElementById('adminUsername');
    const adminPassword = document.getElementById('adminPassword');
    const adminErrorMsg = document.getElementById('adminErrorMsg');

    adminLoginBtn.addEventListener('click', function() {
      if (isAdmin) {
        isAdmin = false;
        this.textContent = '管理';
        this.className = 'btn-admin-login';
        updateUI(currentUser);
        showToast('已登出管理模式');
        render();
      } else {
        adminOverlay.classList.add('active');
        adminUsername.value = '';
        adminPassword.value = '';
        adminErrorMsg.classList.remove('show');
        adminUsername.focus();
      }
    });

    adminConfirmBtn.addEventListener('click', function() {
      const username = adminUsername.value.trim();
      const password = adminPassword.value.trim();

      const found = ADMIN_ACCOUNTS.find(
        acc => acc.username === username && acc.password === password
      );

      if (found) {
        isAdmin = true;
        adminOverlay.classList.remove('active');
        adminLoginBtn.textContent = '登出管理';
        adminLoginBtn.className = 'btn-admin-login active';
        updateUI(currentUser);
        showToast('管理員模式已啟用');
        render();
      } else {
        adminErrorMsg.classList.add('show');
        adminPassword.value = '';
        adminPassword.focus();
      }
    });

    adminUsername.addEventListener('keyup', (e) => { if (e.key === 'Enter') adminConfirmBtn.click(); });
    adminPassword.addEventListener('keyup', (e) => { if (e.key === 'Enter') adminConfirmBtn.click(); });

    adminOverlay.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    // ----- 10d. 圖片上傳預覽 -----
    const fileInput = document.getElementById('imageFile');
    const fileNameDisplay = document.getElementById('fileName');
    const filePreview = document.getElementById('filePreview');

    fileInput.addEventListener('change', function(e) {
      const file = this.files[0];
      if (file) {
        selectedFile = file;
        fileNameDisplay.textContent = `📎 ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

        const reader = new FileReader();
        reader.onload = function(e) {
          filePreview.src = e.target.result;
          filePreview.classList.add('show');
        };
        reader.readAsDataURL(file);
      } else {
        selectedFile = null;
        fileNameDisplay.textContent = '尚未選擇檔案';
        filePreview.classList.remove('show');
      }
    });

    // ----- 10e. 提交投訴（訪客可直接提交） -----
    document.getElementById('complaintForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('userName').value.trim();
      const igName = document.getElementById('igName').value.trim();
      const category = document.getElementById('category').value;
      const priority = document.getElementById('priority').value;
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();

      if (!name || !category || !title || !description) {
        showToast('請填寫所有必填欄位（姓名、類別、標題、內容）', true);
        return;
      }

      let maxId = 0;
      complaints.forEach(c => { if (c.id > maxId) maxId = c.id; });
      const newId = maxId + 1;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 傳送中...';
      submitBtn.disabled = true;

      // 先儲存投訴取得 ID
      const newComplaint = {
        id: newId,
        userName: name,
        igName: igName,
        category: category,
        priority: priority,
        title: title,
        description: description,
        status: '新案件',
        date: getToday(),
        time: getNowTime(),
        imageUrl: ''
      };

      // 儲存到 Firestore
      const success = await addComplaint(newComplaint);

      if (success) {
        // 如果有圖片，上傳圖片
        let imageUrl = '';
        if (selectedFile) {
          const uploadResult = await uploadImage(selectedFile, newId);
          if (uploadResult) {
            imageUrl = uploadResult;
            // 更新該筆投訴的圖片 URL
            const docRef = await db.collection('complaints')
              .where('id', '==', newId)
              .get();
            if (!docRef.empty) {
              await docRef.docs[0].ref.update({ imageUrl: imageUrl });
            }
          }
        }

        // 發送 Email 通知
        await sendEmail({ ...newComplaint, imageUrl: imageUrl });

        document.getElementById('complaintForm').reset();
        document.getElementById('fileName').textContent = '尚未選擇檔案';
        document.getElementById('filePreview').classList.remove('show');
        selectedFile = null;
        showToast(`投訴 #${newId} 已送出，管理員將收到通知`);
      }

      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 送出投訴';
      submitBtn.disabled = false;
    });

    // ----- 10f. 列表按鈕 -----
    document.getElementById('complaintList').addEventListener('click', async function(e) {
      const target = e.target.closest('button');
      if (!target) return;

      const action = target.dataset.action;
      const docId = target.dataset.docid;
      const id = parseInt(target.dataset.id);

      if (!docId || !id) return;

      if (!isAdmin) {
        showToast('請先登入管理模式', true);
        return;
      }

      if (action === 'delete') {
        if (confirm(`確定刪除投訴 #${id} 嗎？`)) {
          const success = await deleteComplaint(docId);
          if (success) showToast(`已刪除投訴 #${id}`);
        }
      } else if (action === 'resolve') {
        const item = complaints.find(c => c.docId === docId);
        if (!item) return;
        if (item.status === '已結案') {
          showToast('此案件已經結案', true);
          return;
        }
        const success = await updateStatus(docId, '已結案');
        if (success) showToast(`案件 #${id} 已結案`);
      } else if (action === 'status') {
        const item = complaints.find(c => c.docId === docId);
        if (!item) return;
        let newStatus;
        if (item.status === '新案件') newStatus = '處理中';
        else if (item.status === '處理中') newStatus = '已結案';
        else newStatus = '新案件';
        const success = await updateStatus(docId, newStatus);
        if (success) showToast(`狀態變更為：${newStatus}`);
      }
    });

    // ----- 10g. 圖片燈箱 -----
    window.openLightbox = function(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('lightbox').classList.add('active');
    };

    document.getElementById('lightbox').addEventListener('click', function() {
      this.classList.remove('active');
    });

    // ----- 10h. 過濾 -----
    document.getElementById('filterStatus').addEventListener('change', render);

    // ----- 10i. 清空全部 -----
    document.getElementById('clearAllBtn').addEventListener('click', async function() {
      if (!isAdmin) {
        showToast('請先登入管理模式', true);
        return;
      }
      if (complaints.length === 0) {
        showToast('目前沒有投訴可清空', true);
        return;
      }
      if (confirm('確定要刪除所有投訴紀錄嗎？（無法復原）')) {
        await clearAllComplaints();
      }
    });

    // ============================================================
    // 11. Firebase Auth 監聽
    // ============================================================

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (!user && isAdmin) {
        isAdmin = false;
        adminLoginBtn.textContent = '管理';
        adminLoginBtn.className = 'btn-admin-login';
      }
      updateUI(user);
    });

    // ============================================================
    // 12. 啟動
    // ============================================================

    listenComplaints();
    console.log('✅ 投訴系統已啟動（訪客可投訴）');
    console.log('👤 管理員帳號:', ADMIN_ACCOUNTS.map(a => a.username).join(', '));
