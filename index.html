<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>投訴系統</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #f4f7fc;
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 1300px;
      width: 100%;
      background: white;
      border-radius: 32px;
      box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
      padding: 2rem 2rem 2.5rem;
    }
    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0b1e33;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 0.3rem;
    }
    h1 i {
      color: #d93c3c;
      font-size: 2rem;
    }
    .subhead {
      color: #5b6f82;
      margin-bottom: 2rem;
      border-left: 4px solid #d93c3c;
      padding-left: 1rem;
      font-weight: 400;
      font-size: 1rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }
    .badge-count {
      background: #eef3f9;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #1f3a57;
    }
    .badge-count i {
      margin-right: 6px;
      color: #c22d2d;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0 1rem 0;
      border-bottom: 1px solid #eef3f9;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #c52a2a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1rem;
    }
    .user-name {
      font-weight: 500;
      color: #1a2c44;
    }
    .user-role {
      font-size: 0.75rem;
      color: #7e93ab;
      background: #eef3f9;
      padding: 0.15rem 0.8rem;
      border-radius: 40px;
    }
    .user-role.admin {
      background: #c52a2a;
      color: white;
    }
    .btn-google {
      background: white;
      border: 1px solid #d7dfe9;
      border-radius: 40px;
      padding: 0.4rem 1.2rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: #2a405b;
      transition: 0.15s;
      font-size: 0.9rem;
    }
    .btn-google:hover {
      background: #f4f8ff;
      border-color: #b0c0d0;
    }
    .btn-google svg {
      width: 18px;
      height: 18px;
    }
    .btn-logout {
      background: transparent;
      border: 1px solid #f5d8d8;
      color: #b43b3b;
      border-radius: 40px;
      padding: 0.3rem 1rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    .btn-logout:hover {
      background: #fff3f3;
    }
    .btn-admin-login {
      background: #2a405b;
      color: white;
      border: none;
      border-radius: 40px;
      padding: 0.3rem 1.2rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
    }
    .btn-admin-login:hover {
      background: #1a2c44;
    }
    .btn-admin-login.active {
      background: #c52a2a;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 2rem;
      margin-top: 0.5rem;
    }
    @media (max-width: 820px) {
      .row {
        grid-template-columns: 1fr;
        gap: 2.5rem;
      }
      .container {
        padding: 1.5rem;
      }
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 1.6rem 1.8rem 2rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.02);
      border: 1px solid #e9edf4;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a2c44;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .card-title i {
      color: #c52a2a;
      width: 28px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #2a405b;
      margin-bottom: 5px;
      letter-spacing: 0.3px;
    }
    label i {
      margin-right: 6px;
      color: #6c7e94;
      width: 18px;
    }
    label .required {
      color: #c52a2a;
      margin-left: 2px;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1px solid #d7dfe9;
      border-radius: 16px;
      font-size: 0.95rem;
      background: #fafcff;
      transition: 0.15s;
      outline: none;
    }
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #b32b2b;
      box-shadow: 0 0 0 3px rgba(179, 43, 43, 0.08);
      background: white;
    }
    textarea {
      resize: vertical;
      min-height: 100px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 500px) {
      .form-row {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }
    .custom-category-group {
      display: none;
      margin-top: -0.5rem;
      margin-bottom: 1.25rem;
    }
    .custom-category-group.show {
      display: block;
    }
    .custom-category-group input {
      border-color: #b32b2b;
      background: #fffbfb;
    }
    .custom-category-group label i {
      color: #c52a2a;
    }
    .image-upload-area {
      border: 2px dashed #d7dfe9;
      border-radius: 16px;
      padding: 1.5rem 1.5rem 0.5rem 1.5rem;
      background: #fafcff;
      transition: 0.15s;
    }
    .image-upload-area.dragover {
      border-color: #b32b2b;
      background: #f8f4f4;
    }
    .image-upload-area .upload-icon {
      font-size: 2rem;
      color: #8a9db0;
      text-align: center;
    }
    .image-upload-area .upload-text {
      color: #6b8097;
      font-size: 0.9rem;
      text-align: center;
    }
    .image-upload-area .upload-hint {
      color: #8a9db0;
      font-size: 0.75rem;
      text-align: center;
      margin-top: 2px;
    }
    .image-preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }
    .image-preview-item {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 12px;
      border: 1px solid #e6ecf5;
      overflow: hidden;
    }
    .image-preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-preview-item .remove-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #c52a2a;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.15s;
    }
    .image-preview-item .remove-btn:hover {
      background: #a81f1f;
      transform: scale(1.1);
    }
    .image-preview-item .file-index {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: rgba(0,0,0,0.6);
      color: white;
      font-size: 0.6rem;
      padding: 0 6px;
      border-radius: 10px;
    }
    .image-upload-area .file-input-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
    }
    .image-upload-area .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .image-upload-area .add-more-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.4rem 1.2rem;
      border: 1px dashed #b32b2b;
      border-radius: 40px;
      color: #b32b2b;
      background: transparent;
      cursor: pointer;
      font-size: 0.85rem;
      transition: 0.15s;
      margin-top: 8px;
    }
    .image-upload-area .add-more-btn:hover {
      background: #fff3f3;
    }
    .image-upload-area .add-more-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .image-count-badge {
      font-size: 0.75rem;
      color: #6b8097;
      margin-left: 8px;
    }
    .btn-primary {
      background: #c52a2a;
      border: none;
      color: white;
      padding: 0.85rem 1.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 0.5rem;
      border: 1px solid #b12222;
    }
    .btn-primary:hover {
      background: #a81f1f;
      transform: scale(0.99);
      box-shadow: 0 6px 16px rgba(197, 42, 42, 0.2);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary i {
      font-size: 1rem;
    }
    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .filter-bar {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .filter-bar select {
      width: auto;
      padding: 0.4rem 1.8rem 0.4rem 1rem;
      border-radius: 40px;
      background: #f4f8ff;
      border: 1px solid #d7dfe9;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .filter-bar .clear-btn {
      background: transparent;
      border: 1px solid #d7dfe9;
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: #4f657c;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .filter-bar .clear-btn:hover {
      background: #f0f4fa;
      border-color: #b0c0d0;
    }
    .empty-state {
      text-align: center;
      padding: 3rem 0.5rem;
      color: #7c8ea3;
    }
    .empty-state i {
      font-size: 3rem;
      opacity: 0.4;
      margin-bottom: 1rem;
    }
    .complaint-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      max-height: 560px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .complaint-item {
      background: #fafcff;
      border: 1px solid #e6ecf5;
      border-radius: 20px;
      padding: 1rem 1.2rem;
      transition: 0.1s;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.6rem 1rem;
    }
    .complaint-item:hover {
      background: #f6f9ff;
      border-color: #cbd8e9;
    }
    .complaint-content {
      flex: 2 1 200px;
    }
    .complaint-title {
      font-weight: 600;
      color: #10273e;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .status-badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .status-badge.待處理 {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }
    .status-badge.調查中 {
      background: #cce5ff;
      color: #004085;
      border: 1px solid #007bff;
    }
    .status-badge.已處理 {
      background: #d4edda;
      color: #155724;
      border: 1px solid #28a745;
    }
    .status-badge.不予受理 {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #dc3545;
    }
    .status-badge.需要補充資料 {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffc107;
    }
    .status-badge.已轉交相關人員 {
      background: #d6d8db;
      color: #383d41;
      border: 1px solid #6c757d;
    }
    .complaint-meta {
      font-size: 0.8rem;
      color: #61768b;
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      margin-top: 4px;
    }
    .complaint-meta i {
      width: 16px;
      color: #7d93ab;
    }
    .complaint-images {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .complaint-images img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e6ecf5;
      cursor: pointer;
      transition: 0.15s;
    }
    .complaint-images img:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }
    .complaint-images .more-badge {
      width: 60px;
      height: 60px;
      border-radius: 10px;
      background: #eef3f9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #4f657c;
      font-weight: 500;
    }
    .complaint-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
      flex-wrap: wrap;
      align-items: center;
    }
    .complaint-actions button {
      background: transparent;
      border: 1px solid #d0dbe9;
      border-radius: 40px;
      padding: 0.25rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: #2a405b;
      cursor: pointer;
      transition: 0.1s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .complaint-actions .btn-delete {
      border-color: #f5d8d8;
      color: #b43b3b;
      background: #fff3f3;
    }
    .complaint-actions .btn-delete:hover {
      background: #fde2e2;
    }
    .status-select {
      padding: 0.2rem 0.6rem;
      border-radius: 30px;
      border: 1px solid #d0dbe9;
      font-size: 0.7rem;
      background: white;
      cursor: pointer;
      outline: none;
    }
    .status-select:focus {
      border-color: #b32b2b;
    }
    .status-select.待處理 { background: #fff3cd; color: #856404; }
    .status-select.調查中 { background: #cce5ff; color: #004085; }
    .status-select.已處理 { background: #d4edda; color: #155724; }
    .status-select.不予受理 { background: #f8d7da; color: #721c24; }
    .status-select.需要補充資料 { background: #fff3cd; color: #856404; }
    .status-select.已轉交相關人員 { background: #d6d8db; color: #383d41; }
    .toast-message {
      background: #1f3a57;
      color: white;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-size: 0.9rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      transition: 0.25s;
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .toast-message.show {
      opacity: 1;
      pointer-events: auto;
    }
    .toast-message i {
      margin-right: 10px;
      color: #ffbaba;
    }
    .text-muted {
      color: #6b8097;
      font-size: 0.85rem;
    }
    hr {
      border: none;
      border-top: 1px solid #eef3f9;
      margin: 0.5rem 0 1.2rem;
    }
    ::-webkit-scrollbar {
      width: 5px;
      background: #eef3f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd6e4;
      border-radius: 10px;
    }
    .admin-badge {
      background: #2a405b;
      color: white;
      padding: 0.1rem 0.8rem;
      border-radius: 40px;
      font-size: 0.7rem;
      margin-left: 8px;
    }
    .login-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .login-overlay.active {
      display: flex;
    }
    .login-box {
      background: white;
      padding: 2.5rem;
      border-radius: 28px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .login-box h3 {
      margin-bottom: 1.5rem;
      color: #0b1e33;
    }
    .login-box input {
      margin-bottom: 1rem;
    }
    .login-box .btn-primary {
      width: 100%;
      margin-top: 0;
    }
    .login-box .error-msg {
      color: #c52a2a;
      font-size: 0.85rem;
      margin-bottom: 0.8rem;
      display: none;
    }
    .login-box .error-msg.show {
      display: block;
    }
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .lightbox .image-counter {
      position: fixed;
      bottom: 2rem;
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.9rem;
    }
    .lightbox .nav-btn {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.2);
      color: white;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      transition: 0.15s;
      z-index: 2001;
    }
    .lightbox .nav-btn:hover {
      background: rgba(255,255,255,0.4);
    }
    .lightbox .nav-btn.prev {
      left: 1rem;
    }
    .lightbox .nav-btn.next {
      right: 1rem;
    }
    @media (max-width: 600px) {
      .lightbox .nav-btn {
        width: 36px;
        height: 36px;
        font-size: 1rem;
      }
      .lightbox .nav-btn.prev { left: 0.5rem; }
      .lightbox .nav-btn.next { right: 0.5rem; }
    }
    .status-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.5rem;
      padding-top: 0.8rem;
      border-top: 1px solid #eef3f9;
      margin-top: 0.8rem;
    }
    .status-legend .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: #4f657c;
    }
    .status-legend .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }
    .legend-dot.待處理 { background: #ffc107; }
    .legend-dot.調查中 { background: #007bff; }
    .legend-dot.已處理 { background: #28a745; }
    .legend-dot.不予受理 { background: #dc3545; }
    .legend-dot.需要補充資料 { background: #ffc107; }
    .legend-dot.已轉交相關人員 { background: #6c757d; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fas fa-megaphone"></i> 投訴系統</h1>
      <div class="subhead">
        <span><i class="fas fa-flag" style="color:#c52a2a; margin-right: 6px;"></i> 訪客可直接投訴，管理員將即時處理</span>
        <span class="badge-count"><i class="fas fa-list-ul"></i> 總投訴 <span id="totalCount">0</span></span>
      </div>
    </header>

    <div class="top-nav">
      <div class="user-info" id="userInfo">

          <span class="legend-item"><span class="legend-dot 已處理"></span> 🟢 已處理</span>
          <span class="legend-item"><span class="legend-dot 不予受理"></span> 🔴 不予受理</span>

  <!-- Toast -->
  <div id="toast" class="toast-message"><i class="fas fa-check-circle"></i> <span id="toastText">操作成功</span></div>

  <script>
    // ============================================================
    // 1. ⚙️ 設定區（全部已填入）
    // ============================================================

    const firebaseConfig = {
      apiKey: "AIzaSyDKltRWzp2DH2nbzfDL4BI4JWZXRH-ekFQ",
      authDomain: "dader-c8f22.firebaseapp.com",
      projectId: "dader-c8f22",
      storageBucket: "dader-c8f22.firebasestorage.app",
      messagingSenderId: "4677472502",
      appId: "1:4677472502:web:6f7ab3c621a27842af1cd7",
      measurementId: "G-GP9F39N0LS"
    };

    const emailjsConfig = {
      serviceID: "service_6vu945a",
      templateID: "6f2xzro",
      publicKey: "KU2Ya4rXsyHXopGAM"
    };

    const ADMIN_ACCOUNTS = [
      { username: "dader60dader60", password: "dader60dader0909575253h@" }
    ];

    const MAX_IMAGES = 10;
    const IMGBB_API_KEY = "e36eefa56ac3084d8b981ee390bcba27";

    const STATUS_LIST = [
      '待處理',
      '調查中',
      '已處理',
      '不予受理',
      '需要補充資料',
      '已轉交相關人員'
    ];

    // ============================================================
    // 2. 初始化 Firebase
    // ============================================================

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    db.enablePersistence({ synchronizeTabs: true }).catch(err => console.warn(err));
    emailjs.init(emailjsConfig.publicKey);

    // ============================================================
    // 3. 全域變數
    // ============================================================

    let currentUser = null;
    let isAdmin = false;
    let complaints = [];
    let unsubscribeSnapshot = null;
    let selectedFiles = [];

    // ============================================================
    // 4. 工具函數
    // ============================================================

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getToday() {
      const d = new Date();
      return d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
    }

    function getNowTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0');
    }

    function getInitials(name) {
      if (!name) return '👤';
      const parts = name.trim().split(' ');
      if (parts.length >= 2) return parts[0][0] + parts[1][0];
      return name.substring(0, 2).toUpperCase();
    }

    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      const textSpan = document.getElementById('toastText');
      textSpan.textContent = msg;
      toast.style.opacity = '1';
      toast.style.background = isError ? '#a52a2a' : '#1f3a57';
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        toast.style.opacity = '0';
      }, 3000);
    }

    // ============================================================
    // 5. ImgBB 圖片上傳
    // ============================================================

    async function uploadToImgBB(file) {
      const formData = new FormData();
      formData.append('image', file);

      try {
        const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          return data.data.url;
        } else {
          console.error('ImgBB 上傳失敗:', data);
          return null;
        }
      } catch (error) {
        console.error('ImgBB 上傳錯誤:', error);
        return null;
      }
    }

    async function uploadMultipleImages(files) {
      if (!files || files.length === 0) return [];

      const urls = [];
      for (let i = 0; i < files.length; i++) {
        const url = await uploadToImgBB(files[i]);
        if (url) {
          urls.push(url);
        } else {
          showToast(`第 ${i+1} 張圖片上傳失敗`, true);
        }
      }
      return urls;
    }

    // ============================================================
    // 6. 圖片管理
    // ============================================================

    function updateImagePreview() {
      const grid = document.getElementById('imagePreviewGrid');
      const badge = document.getElementById('imageCountBadge');
      const addBtn = document.getElementById('addMoreBtn');

      grid.innerHTML = '';
      selectedFiles.forEach((file, index) => {
        const div = document.createElement('div');
        div.className = 'image-preview-item';
        const img = document.createElement('img');
        const reader = new FileReader();
        reader.onload = (e) => { img.src = e.target.result; };
        reader.readAsDataURL(file);
        const removeBtn = document.createElement('button');
        removeBtn.className = 'remove-btn';
        removeBtn.innerHTML = '<i class="fas fa-times"></i>';
        removeBtn.onclick = (e) => {
          e.stopPropagation();
          selectedFiles.splice(index, 1);
          updateImagePreview();
        };
        const idxLabel = document.createElement('span');
        idxLabel.className = 'file-index';
        idxLabel.textContent = index + 1;
        div.appendChild(img);
        div.appendChild(removeBtn);
        div.appendChild(idxLabel);
        grid.appendChild(div);
      });

      badge.textContent = `已選 ${selectedFiles.length} / ${MAX_IMAGES}`;
      addBtn.disabled = selectedFiles.length >= MAX_IMAGES;
    }

    function handleFileSelect(files) {
      const remaining = MAX_IMAGES - selectedFiles.length;
      const toAdd = Math.min(files.length, remaining);
      for (let i = 0; i < toAdd; i++) {
        selectedFiles.push(files[i]);
      }
      updateImagePreview();
      if (files.length > toAdd) {
        showToast(`已超過上限，僅新增 ${toAdd} 張`, true);
      }
    }

    // ============================================================
    // 7. Firestore 操作
    // ============================================================

    function listenComplaints() {
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      unsubscribeSnapshot = db.collection('complaints')
        .orderBy('createdAt', 'desc')
        .onSnapshot((snapshot) => {
          complaints = [];
          snapshot.forEach((doc) => {
            const data = doc.data();
            complaints.push({
              id: data.id,
              docId: doc.id,
              userName: data.userName || '',
              igName: data.igName || '',
              category: data.category || '',
              priority: data.priority || '',
              title: data.title || '',
              description: data.description || '',
              status: data.status || '待處理',
              date: data.date || '',
              time: data.time || '',
              imageUrls: data.imageUrls || [],
              createdAt: data.createdAt || 0
            });
          });
          render();
        }, (error) => {
          console.error('Firestore 監聽錯誤:', error);
          showToast('連線資料庫失敗，請檢查網路', true);
        });
    }

    async function addComplaint(complaint) {
      try {
        await db.collection('complaints').add({
          id: complaint.id,
          userName: complaint.userName,
          igName: complaint.igName || '',
          category: complaint.category,
          priority: complaint.priority,
          title: complaint.title,
          description: complaint.description,
          status: complaint.status || '待處理',
          date: complaint.date,
          time: complaint.time,
          imageUrls: complaint.imageUrls || [],
          createdAt: Date.now()
        });
        return true;
      } catch (error) {
        console.error('儲存失敗:', error);
        showToast('儲存失敗，請稍後再試', true);
        return false;
      }
    }

    async function updateStatus(docId, newStatus) {
      try {
        await db.collection('complaints').doc(docId).update({ status: newStatus });
        return true;
      } catch (error) {
        console.error('更新失敗:', error);
        showToast('更新失敗', true);
        return false;
      }
    }

    async function deleteComplaint(docId) {
      try {
        await db.collection('complaints').doc(docId).delete();
        return true;
      } catch (error) {
        console.error('刪除失敗:', error);
        showToast('刪除失敗', true);
        return false;
      }
    }

    async function clearAllComplaints() {
      try {
        const snapshot = await db.collection('complaints').get();
        const batch = db.batch();
        snapshot.forEach((doc) => batch.delete(doc.ref));
        await batch.commit();
        showToast('已清空所有投訴');
        return true;
      } catch (error) {
        console.error('清空失敗:', error);
        showToast('清空失敗', true);
        return false;
      }
    }

    // ============================================================
    // 8. 發送 Email 通知
    // ============================================================

    async function sendEmail(complaint) {
      const imageCount = complaint.imageUrls ? complaint.imageUrls.length : 0;
      const subject = `【新投訴 #${complaint.id}】${complaint.title}`;
      
      // 建立完整的郵件內容
      const message = `
        姓名：${complaint.userName}
        IG 名稱：${complaint.igName || '未提供'}
        類別：${complaint.category}
        嚴重程度：${complaint.priority}
        標題：${complaint.title}
        內容：${complaint.description}
        提交時間：${complaint.date} ${complaint.time || ''}
        狀態：${complaint.status || '待處理'}
        圖片數量：${imageCount} 張
      `;

      try {
        await emailjs.send(
          emailjsConfig.serviceID,
          emailjsConfig.templateID,
          {
            name: complaint.userName,
            time: `${complaint.date} ${complaint.time || ''}`,
            message: message,
            title: complaint.title
          }
        );
        console.log('✅ Email 通知發送成功');
      } catch (error) {
        console.error('❌ Email 發送失敗:', error);
      }
    }

    // ============================================================
    // 9. 渲染
    // ============================================================

    function render() {
      const listEl = document.getElementById('complaintList');
      const filterStatus = document.getElementById('filterStatus').value;
      const totalSpan = document.getElementById('totalCount');

      let filtered = complaints;
      if (filterStatus !== 'all') {
        filtered = complaints.filter(c => c.status === filterStatus);
      }

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <p style="margin-top: 6px;">目前沒有投訴紀錄</p>
            <span class="text-muted">新增一筆投訴吧</span>
          </div>
        `;
      } else {
        let html = '';
        filtered.forEach(item => {
          const status = item.status || '待處理';
          const statusClass = status;

          let statusControl = '';
          if (isAdmin) {
            const options = STATUS_LIST.map(s => 
              `<option value="${s}" ${s === status ? 'selected' : ''}>${s}</option>`
            ).join('');
            statusControl = `
              <select class="status-select ${statusClass}" data-action="statusChange" data-docid="${item.docId}" data-id="${item.id}">
                ${options}
              </select>
            `;
          } else {
            statusControl = `<span class="status-badge ${statusClass}">${status}</span>`;
          }

          const adminButtons = isAdmin ? `
            <button class="btn-delete" data-action="delete" data-docid="${item.docId}" data-id="${item.id}"><i class="fas fa-times"></i></button>
          ` : '';

          let imagesHtml = '';
          if (item.imageUrls && item.imageUrls.length > 0) {
            const showUrls = item.imageUrls.slice(0, 4);
            const remaining = item.imageUrls.length - 4;
            imagesHtml = '<div class="complaint-images">';
            showUrls.forEach((url, idx) => {
              imagesHtml += `<img src="${url}" alt="投訴圖片" onclick="openLightbox('${item.docId}', ${idx})" />`;
            });
            if (remaining > 0) {
              imagesHtml += `<div class="more-badge">+${remaining}</div>`;
            }
            imagesHtml += '</div>';
          }

          const igHtml = item.igName ? `<span><i class="fab fa-instagram"></i> ${escapeHtml(item.igName)}</span>` : '';

          html += `
            <div class="complaint-item" data-id="${item.id}" data-docid="${item.docId}">
              <div class="complaint-content">
                <div class="complaint-title">
                  <span>${escapeHtml(item.title)}</span>
                  ${statusControl}
                  ${isAdmin ? '<span class="admin-badge">管理</span>' : ''}
                </div>
                <div class="complaint-meta">
                  <span><i class="fas fa-user"></i> ${escapeHtml(item.userName)}</span>
                  ${igHtml}
                  <span><i class="fas fa-tag"></i> ${escapeHtml(item.category)}</span>
                  <span><i class="fas fa-exclamation-triangle"></i> ${escapeHtml(item.priority)}</span>
                  <span><i class="far fa-calendar-alt"></i> ${item.date || '未知'} ${item.time || ''}</span>
                  ${item.imageUrls && item.imageUrls.length > 0 ? `<span><i class="fas fa-image"></i> ${item.imageUrls.length}張</span>` : ''}
                </div>
                <div style="margin-top: 6px; font-size:0.9rem; color:#2b405b;">${escapeHtml(item.description)}</div>
                ${imagesHtml}
              </div>
              <div class="complaint-actions">
                ${adminButtons}
              </div>
            </div>
          `;
        });
        listEl.innerHTML = html;
      }

      totalSpan.textContent = complaints.length;
    }

    // ============================================================
    // 10. 圖片燈箱
    // ============================================================

    let lightboxImages = [];
    let lightboxIndex = 0;

    window.openLightbox = function(docId, index) {
      const complaint = complaints.find(c => c.docId === docId);
      if (!complaint || !complaint.imageUrls || complaint.imageUrls.length === 0) return;

      lightboxImages = complaint.imageUrls;
      lightboxIndex = index || 0;

      const img = document.getElementById('lightboxImg');
      const counter = document.getElementById('lightboxCounter');
      const prevBtn = document.getElementById('lightboxPrev');
      const nextBtn = document.getElementById('lightboxNext');

      img.src = lightboxImages[lightboxIndex];
      counter.textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;

      prevBtn.style.display = lightboxImages.length > 1 ? 'block' : 'none';
      nextBtn.style.display = lightboxImages.length > 1 ? 'block' : 'none';

      document.getElementById('lightbox').classList.add('active');
    };

    function navigateLightbox(delta) {
      const newIndex = lightboxIndex + delta;
      if (newIndex < 0 || newIndex >= lightboxImages.length) return;
      lightboxIndex = newIndex;
      document.getElementById('lightboxImg').src = lightboxImages[lightboxIndex];
      document.getElementById('lightboxCounter').textContent = `${lightboxIndex + 1} / ${lightboxImages.length}`;
    }

    document.getElementById('lightboxPrev').addEventListener('click', (e) => {
      e.stopPropagation();
      navigateLightbox(-1);
    });

    document.getElementById('lightboxNext').addEventListener('click', (e) => {
      e.stopPropagation();
      navigateLightbox(1);
    });

    document.getElementById('lightbox').addEventListener('click', function() {
      this.classList.remove('active');
    });

    document.addEventListener('keydown', (e) => {
      if (!document.getElementById('lightbox').classList.contains('active')) return;
      if (e.key === 'ArrowLeft') navigateLightbox(-1);
      if (e.key === 'ArrowRight') navigateLightbox(1);
      if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('active');
    });

    // ============================================================
    // 11. UI 更新
    // ============================================================

    function updateUI(user) {
      const avatar = document.getElementById('userAvatar');
      const nameDisplay = document.getElementById('userNameDisplay');
      const roleDisplay = document.getElementById('userRoleDisplay');
      const googleBtn = document.getElementById('googleLoginBtn');
      const logoutBtn = document.getElementById('logoutBtn');
      const adminLoginBtn = document.getElementById('adminLoginBtn');

      if (user) {
        const displayName = user.displayName || user.email || '使用者';
        avatar.textContent = getInitials(displayName);
        nameDisplay.textContent = displayName;

        if (isAdmin) {
          roleDisplay.textContent = '管理員';
          roleDisplay.className = 'user-role admin';
        } else {
          roleDisplay.textContent = '一般使用者';
          roleDisplay.className = 'user-role';
        }

        googleBtn.style.display = 'none';
        logoutBtn.style.display = 'inline-block';

        const nameInput = document.getElementById('userName');
        if (displayName && !nameInput.value) {
          nameInput.value = displayName;
        }
      } else {
        avatar.textContent = '👤';
        nameDisplay.textContent = '訪客';
        roleDisplay.textContent = '一般';
        roleDisplay.className = 'user-role';
        googleBtn.style.display = 'inline-flex';
        logoutBtn.style.display = 'none';

        if (isAdmin) {
          isAdmin = false;
          adminLoginBtn.textContent = '管理';
          adminLoginBtn.className = 'btn-admin-login';
        }
      }
    }

    // ============================================================
    // 12. 事件處理
    // ============================================================

    // ----- 12a. Google 登入 -----
    async function googleLogin() {
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        const result = await auth.signInWithPopup(provider);
        currentUser = result.user;
        updateUI(currentUser);
        showToast(`歡迎 ${currentUser.displayName || currentUser.email}`);
      } catch (error) {
        console.error('Google 登入失敗:', error);
        showToast('登入失敗，請稍後再試', true);
      }
    }

    document.getElementById('googleLoginBtn').addEventListener('click', googleLogin);

    // ----- 12b. 登出 -----
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      try {
        await auth.signOut();
        currentUser = null;
        isAdmin = false;
        updateUI(null);
        showToast('已登出');
      } catch (error) {
        console.error('登出失敗:', error);
      }
    });

    // ----- 12c. 管理員登入 -----
    const adminLoginBtn = document.getElementById('adminLoginBtn');
    const adminOverlay = document.getElementById('adminLoginOverlay');
    const adminConfirmBtn = document.getElementById('adminLoginConfirmBtn');
    const adminUsername = document.getElementById('adminUsername');
    const adminPassword = document.getElementById('adminPassword');
    const adminErrorMsg = document.getElementById('adminErrorMsg');

    adminLoginBtn.addEventListener('click', function() {
      if (isAdmin) {
        isAdmin = false;
        this.textContent = '管理';
        this.className = 'btn-admin-login';
        updateUI(currentUser);
        showToast('已登出管理模式');
        render();
      } else {
        adminOverlay.classList.add('active');
        adminUsername.value = '';
        adminPassword.value = '';
        adminErrorMsg.classList.remove('show');
        adminUsername.focus();
      }
    });

    adminConfirmBtn.addEventListener('click', function() {
      const username = adminUsername.value.trim();
      const password = adminPassword.value.trim();

      const found = ADMIN_ACCOUNTS.find(
        acc => acc.username === username && acc.password === password
      );

      if (found) {
        isAdmin = true;
        adminOverlay.classList.remove('active');
        adminLoginBtn.textContent = '登出管理';
        adminLoginBtn.className = 'btn-admin-login active';
        updateUI(currentUser);
        showToast('管理員模式已啟用');
        render();
      } else {
        adminErrorMsg.classList.add('show');
        adminPassword.value = '';
        adminPassword.focus();
      }
    });

    adminUsername.addEventListener('keyup', (e) => { if (e.key === 'Enter') adminConfirmBtn.click(); });
    adminPassword.addEventListener('keyup', (e) => { if (e.key === 'Enter') adminConfirmBtn.click(); });

    adminOverlay.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('active');
    });

    // ----- 12d. 類別切換 -----
    document.getElementById('category').addEventListener('change', function() {
      const customGroup = document.getElementById('customCategoryGroup');
      if (this.value === '其他') {
        customGroup.classList.add('show');
      } else {
        customGroup.classList.remove('show');
      }
    });

    // ----- 12e. 圖片上傳 -----
    const imageInput = document.getElementById('imageInput');
    const addMoreBtn = document.getElementById('addMoreBtn');
    const uploadArea = document.getElementById('imageUploadArea');

    addMoreBtn.addEventListener('click', () => {
      imageInput.click();
    });

    imageInput.addEventListener('change', function(e) {
      if (this.files && this.files.length > 0) {
        handleFileSelect(this.files);
        this.value = '';
      }
    });

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        handleFileSelect(e.dataTransfer.files);
      }
    });

    // ----- 12f. 提交投訴 -----
    document.getElementById('complaintForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('userName').value.trim();
      const igName = document.getElementById('igName').value.trim();
      let category = document.getElementById('category').value;
      const priority = document.getElementById('priority').value;
      const title = document.getElementById('title').value.trim();
      const description = document.getElementById('description').value.trim();

      if (category === '其他') {
        const custom = document.getElementById('customCategory').value.trim();
        if (!custom) {
          showToast('請輸入自訂類別名稱', true);
          return;
        }
        category = custom;
      }

      if (!name || !category || !title || !description) {
        showToast('請填寫所有必填欄位（姓名、類別、標題、內容）', true);
        return;
      }

      let maxId = 0;
      complaints.forEach(c => { if (c.id > maxId) maxId = c.id; });
      const newId = maxId + 1;

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 上傳圖片中...';
      submitBtn.disabled = true;

      let imageUrls = [];
      if (selectedFiles.length > 0) {
        imageUrls = await uploadMultipleImages(selectedFiles);
      }

      const newComplaint = {
        id: newId,
        userName: name,
        igName: igName,
        category: category,
        priority: priority,
        title: title,
        description: description,
        status: '待處理',
        date: getToday(),
        time: getNowTime(),
        imageUrls: imageUrls
      };

      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 儲存中...';

      const success = await addComplaint(newComplaint);

      if (success) {
        await sendEmail(newComplaint);
        document.getElementById('complaintForm').reset();
        selectedFiles = [];
        updateImagePreview();
        document.getElementById('customCategoryGroup').classList.remove('show');
        showToast(`投訴 #${newId} 已送出，狀態：🟡 待處理`);
      }

      submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 送出投訴';
      submitBtn.disabled = false;
    });

    // ----- 12g. 狀態變更（管理員下拉選單）-----
    document.getElementById('complaintList').addEventListener('change', async function(e) {
      const target = e.target.closest('select');
      if (!target) return;
      if (target.dataset.action !== 'statusChange') return;

      const docId = target.dataset.docid;
      const id = parseInt(target.dataset.id);
      const newStatus = target.value;

      if (!docId || !id) return;
      if (!isAdmin) {
        showToast('請先登入管理模式', true);
        return;
      }

      const success = await updateStatus(docId, newStatus);
      if (success) {
        showToast(`已更新狀態為：${newStatus}`);
      }
    });

    // ----- 12h. 刪除按鈕 -----
    document.getElementById('complaintList').addEventListener('click', async function(e) {
      const target = e.target.closest('button');
      if (!target) return;

      const action = target.dataset.action;
      const docId = target.dataset.docid;
      const id = parseInt(target.dataset.id);

      if (!docId || !id) return;

      if (action === 'delete') {
        if (!isAdmin) {
          showToast('請先登入管理模式', true);
          return;
        }
        if (confirm(`確定刪除投訴 #${id} 嗎？`)) {
          const success = await deleteComplaint(docId);
          if (success) showToast(`已刪除投訴 #${id}`);
        }
      }
    });

    // ----- 12i. 過濾 -----
    document.getElementById('filterStatus').addEventListener('change', render);

    // ----- 12j. 清空全部 -----
    document.getElementById('clearAllBtn').addEventListener('click', async function() {
      if (!isAdmin) {
        showToast('請先登入管理模式', true);
        return;
      }
      if (complaints.length === 0) {
        showToast('目前沒有投訴可清空', true);
        return;
      }
      if (confirm('確定要刪除所有投訴紀錄嗎？（無法復原）')) {
        await clearAllComplaints();
      }
    });

    // ============================================================
    // 13. Firebase Auth 監聽
    // ============================================================

    auth.onAuthStateChanged((user) => {
      currentUser = user;
      if (!user && isAdmin) {
        isAdmin = false;
        adminLoginBtn.textContent = '管理';
        adminLoginBtn.className = 'btn-admin-login';
      }
      updateUI(user);
    });

    // ============================================================
    // 14. 啟動
    // ============================================================

    listenComplaints();
    console.log('✅ 投訴系統已啟動');
    console.log('📊 狀態選項:', STATUS_LIST.join(', '));
  </script>
</body>
</html>
